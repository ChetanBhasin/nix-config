# ===============================================
# MODERN TMUX CONFIGURATION
# ===============================================
# Discoverable prefix menus are generated from home/tmux/which-key-config.yaml

# ===============================================
# BASIC SETTINGS
# ===============================================

# Fix terminal colors and features
set-option -g default-terminal "tmux-256color"

# Advertise rich capabilities only for known Alacritty clients; generic SSH clients use tmux defaults.
# A fixed array index makes reloading idempotent instead of appending duplicates.
set -g terminal-features[100] 'alacritty*:RGB:clipboard:extkeys:focus:title'

# Conservative timing stays reliable when SSH clients join an existing server
set-option -s escape-time 50
set -sg repeat-time 600

# Preserve modified keys as CSI-u sequences so TUI applications can distinguish Shift+Enter
set -s extended-keys on
set -s extended-keys-format csi-u

# Scrollback size and the Nix-managed shell are set by Home Manager

# Enable focus events
set -g focus-events on

# Permit DCS passthrough only from visible, trusted panes; hidden panes cannot write to the client
set -g allow-passthrough on

# Keep normal pane apps from tmux clipboard writes; trusted passthrough remains explicit above
set -s set-clipboard external

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Disable aggressive resize - can cause flicker loops with TUI apps like Claude Code
# that update the screen in place when content exceeds visible area
setw -g aggressive-resize off

# Activity monitoring
set -g monitor-activity on
set -g activity-action none

# ===============================================
# PREFIX-LESS BINDINGS (can't be in which-key)
# ===============================================
# These don't require prefix, so they can't be discovered via which-key
# They're documented in which-key's help menu as "Alt shortcuts"

# Quick session switching with Alt+number
bind-key -n M-1 if-shell 'tmux has-session -t 1' 'switch-client -t 1'
bind-key -n M-2 if-shell 'tmux has-session -t 2' 'switch-client -t 2'
bind-key -n M-3 if-shell 'tmux has-session -t 3' 'switch-client -t 3'
bind-key -n M-4 if-shell 'tmux has-session -t 4' 'switch-client -t 4'
bind-key -n M-5 if-shell 'tmux has-session -t 5' 'switch-client -t 5'

# Quick window navigation with Alt+h/l
bind-key -n M-h previous-window
bind-key -n M-l next-window

# Quick window switching with Super+number (Super = Cmd on macOS, Ctrl+Shift on Linux)
# Keep the legacy Alacritty sequences while already-open terminal processes age out.
set -s user-keys[0] "\e[1;3P"
set -s user-keys[1] "\e[2;3P"
set -s user-keys[2] "\e[3;3P"
set -s user-keys[3] "\e[4;3P"
set -s user-keys[4] "\e[5;3P"
set -s user-keys[5] "\e[6;3P"
set -s user-keys[6] "\e[7;3P"
set -s user-keys[7] "\e[8;3P"
set -s user-keys[8] "\e[9;3P"

bind-key -n User0 select-window -t 1
bind-key -n User1 select-window -t 2
bind-key -n User2 select-window -t 3
bind-key -n User3 select-window -t 4
bind-key -n User4 select-window -t 5
bind-key -n User5 select-window -t 6
bind-key -n User6 select-window -t 7
bind-key -n User7 select-window -t 8
bind-key -n User8 select-window -t 9

# Alacritty emits these CSI-u keys for physical Cmd+1-9 on Darwin and
# Ctrl+Shift+1-9 on Linux. Tmux parses them as native Ctrl+Shift keys.
bind-key -n C-S-1 select-window -t 1
bind-key -n C-S-2 select-window -t 2
bind-key -n C-S-3 select-window -t 3
bind-key -n C-S-4 select-window -t 4
bind-key -n C-S-5 select-window -t 5
bind-key -n C-S-6 select-window -t 6
bind-key -n C-S-7 select-window -t 7
bind-key -n C-S-8 select-window -t 8
bind-key -n C-S-9 select-window -t 9

# ===============================================
# COPY MODE BINDINGS (vi-style)
# ===============================================
# These are mode-specific, not prefix-triggered

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ===============================================
# MOUSE CONFIGURATION
# ===============================================

set -g mouse on
bind-key -n MouseDown1Pane select-pane -t=\; send-keys -M
bind-key -n MouseDown1Status select-window -t=
bind-key -n MouseDrag1Pane if -Ft= '#{mouse_any_flag}' 'if -Ft= "#{pane_in_mode}" "copy-mode -M" "send-keys -M"' 'copy-mode -M'

# ===============================================
# PLUGIN CONFIGURATIONS
# ===============================================

# Session persistence (resurrect/continuum)
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-shell-history 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'

# FZF URL settings
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Battery indicator (using nerd font icons)
set -g @batt_icon_status_charged '󰂄'
set -g @batt_icon_status_charging '󰂄'
set -g @batt_icon_status_discharging '󰁹'
set -g @batt_icon_status_attached '󰂄'
set -g @batt_icon_status_unknown '󰂑'
set -g @batt_icon_charge_tier8 '󰁹'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier6 '󰁿'
set -g @batt_icon_charge_tier5 '󰁾'
set -g @batt_icon_charge_tier4 '󰁽'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier1 '󰂎'

# Runtime paths and feature flags are overridden by Home Manager
set -ogq @cb_tmux_config '~/.config/tmux/tmux.conf'
set -ogq @cb_tmux_which_key '~/.config/tmux/which-key-init.tmux'
set -ogq @cb_tmux_rename_popup 'tmux-rename-popup'
set -ogq @cb_tmux_fzf 1
set -ogq @cb_tmux_thumbs 1
set -ogq @cb_tmux_fleet 0

## Remove watcher hooks left by older tmux-fleet releases on every configuration load.
## The fleet plugin runs before this shared config, so only disabled fleet unsets its alias.
set-hook -gu 'session-created[942]'
set-hook -gu 'session-closed[942]'
set-hook -gu 'session-renamed[942]'
set-hook -gu 'client-attached[942]'
set-hook -gu 'client-detached[942]'
set-hook -gu 'client-session-changed[942]'
set-hook -gu 'session-window-changed[942]'
set-hook -gu 'window-linked[942]'
set-hook -gu 'window-unlinked[942]'
if-shell -F '#{==:#{@cb_tmux_fleet},0}' 'set-option -gu command-alias[220]'

# Which-key style menus (pre-generated from YAML config)
source-file -F '#{@cb_tmux_which_key}'

# Complex FZF bindings (can't be in which-key due to quoting issues)
if-shell -F '#{@cb_tmux_fzf}' {
  bind-key F display-popup -E -w 80% -h 80% '\
    choice=$(printf "Switch Session\nNew Session\nKill Session\nFind Window\nFind Files\nGrep Content\nLazygit\nReload Config" | fzf --prompt="Action: " --layout=reverse --border) && \
    case "$choice" in \
      "Switch Session") target=$(tmux list-sessions -F "#S" | fzf --reverse) && [ -n "$target" ] && tmux switch-client -t "$target" ;; \
      "New Session") tmux command-prompt -p "Session name:" "new-session -A -s %%" ;; \
      "Kill Session") target=$(tmux list-sessions -F "#S" | fzf --prompt="Kill: ") && [ -n "$target" ] && tmux kill-session -t "$target" ;; \
      "Find Window") selection=$(tmux list-windows -F "#I: #W" | fzf) && [ -n "$selection" ] && tmux select-window -t "${selection%%:*}" ;; \
      "Find Files") tmux display-popup -E -w 80% -h 80% "find . -type f | fzf --preview=\"bat --color=always {}\"" ;; \
      "Grep Content") tmux display-popup -E -w 80% -h 80% "rg --color=always -n . | fzf --ansi" ;; \
      "Lazygit") tmux display-popup -E -w 90% -h 90% "lazygit" ;; \
      "Reload Config") tmux reload-config ;; \
    esac'

  bind-key P display-popup -E -w 80% -h 60% '\
    project=$(for dir in "$HOME"/Projects/*; do [ -d "$dir" ] && basename "$dir"; done | sort | fzf --prompt="Project: " --layout=reverse --border) && \
    session_name=$(printf "%s" "$project" | tr ".:" "__") && \
    tmux new-session -A -s "$session_name" -c "$HOME/Projects/$project"'

} {
  bind-key F display-message "FZF integration is disabled (cb.tmux.enableFzfIntegration)"
  bind-key P display-message "FZF integration is disabled (cb.tmux.enableFzfIntegration)"
}

# tmux-thumbs (vimium-like hints for text selection)
set -g @thumbs-key T
set -g @thumbs-alphabet qwerty-homerow
set -g @thumbs-fg-color "#d0c0a0"
set -g @thumbs-bg-color "#1d2021"
set -g @thumbs-hint-fg-color "#c9a257"
set -g @thumbs-hint-bg-color "#1d2021"
set -g @thumbs-select-fg-color "#1d2021"
set -g @thumbs-select-bg-color "#c9a257"
set -g @thumbs-command 'tmux set-buffer -w -- "{}" && tmux display-message "Copied: {}"'
set -g @thumbs-upcase-command 'tmux set-buffer -w -- "{}" && tmux paste-buffer'
set -g @thumbs-regexp-1 '[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+'
set -g @thumbs-regexp-2 '[a-f0-9]{7,40}'

# ===============================================
# OVERRIDE PLUGIN DEFAULTS (must be last)
# ===============================================

# Home Manager owns the configured prefix; keep the traditional Ctrl-Space NUL fallback
bind-key 'C-@' send-prefix

# Override sensible plugin's default-command
set-option -g default-command ""

# Unbind default keys that we're reassigning
unbind p  # was: previous-window
unbind s  # was: choose-tree
unbind w  # was: choose-window

# Create command aliases for direct submenu access
# Using the same pattern as which-key-init.tmux for proper format expansion
set -gF command-alias[210] show-wk-panes='display-menu -x C -y C -T "#[align=centre,bold,fg=#c9a257]+Panes" #{@wk_menu_panes}'
set -gF command-alias[211] show-wk-sessions='display-menu -x C -y C -T "#[align=centre,bold,fg=#c9a257]+Sessions" #{@wk_menu_sessions}'
set -gF command-alias[212] show-wk-windows='display-menu -x C -y C -T "#[align=centre,bold,fg=#c9a257]+Windows" #{@wk_menu_windows}'
set -gF command-alias[213] show-wk-git='display-menu -x C -y C -T "#[align=centre,bold,fg=#c9a257]+Git" #{@wk_menu_git}'
set -gF command-alias[214] show-wk-find='display-menu -x C -y C -T "#[align=centre,bold,fg=#c9a257]+Find" #{@wk_menu_find}'
set -gF command-alias[215] show-wk-help='display-menu -x C -y C -T "#[align=centre,bold,fg=#c9a257]+Help" #{@wk_menu_help}'
set -g command-alias[216] 'cb-thumbs=if-shell -F "#{@cb_tmux_thumbs}" "thumbs-pick" "display-message \"Thumbs integration is disabled (cb.tmux.enableThumbs)\""'
# Popups get a synthetic TMUX_PANE, so resolve and pass the originating pane first.
# The helper keeps entered names as single argv values, including spaces and punctuation.
set -g command-alias[217] 'rename-pane-popup=run-shell -C "display-popup -E -w 60 -h 7 -S fg=#c9a257 -T \"#[align=centre,bold] Rename pane \" \"#{@cb_tmux_rename_popup} pane #{pane_id}\""'
set -g command-alias[218] 'rename-window-popup=run-shell -C "display-popup -E -w 60 -h 7 -S fg=#c9a257 -T \"#[align=centre,bold] Rename window \" \"#{@cb_tmux_rename_popup} window #{pane_id}\""'
set -g command-alias[219] 'rename-session-popup=run-shell -C "display-popup -E -w 60 -h 7 -S fg=#c9a257 -T \"#[align=centre,bold] Rename session \" \"#{@cb_tmux_rename_popup} session #{pane_id}\""'
set -g command-alias[221] 'cb-all-sessions=if-shell -F "#{@cb_tmux_fleet}" "tmux-fleet-switch" "choose-tree -Zs"'

# Direct session/submenu bindings
bind-key S cb-all-sessions
bind-key p show-wk-panes
bind-key s show-wk-sessions
bind-key w show-wk-windows
bind-key g show-wk-git
bind-key f show-wk-find
bind-key ? show-wk-help

# Keep tmux's standard rename keys, but use the centered input popups
bind-key , rename-window-popup
bind-key '$' rename-session-popup

# Window navigation
bind-key N previous-window
bind-key n next-window

# ===============================================
# STATUS LINE (GRUVBOX NIGHT)
# ===============================================

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100

# Compact Gruvbox bar: connection/session, windows, then pane and remote-host context
set -g status-style "bg=#1d2021,fg=#96918a"
set -g status-left-style "bg=#1d2021,fg=#96918a"
set -g status-right-style "bg=#1d2021,fg=#96918a"
set -g status-left '#{?SSH_CONNECTION,#[bg=#84a9b2#,fg=#1d2021#,bold] SSH #[bg=#1d2021] ,}#[bg=#38321f,fg=#c9a257,bold] #S #[bg=#1d2021,fg=#3c3836,nobold]│ '
set -g status-right '#{?synchronize-panes,#[bg=#db7e75#,fg=#1d2021#,bold] SYNC #[bg=#1d2021#,fg=#7c6f64#,nobold],}#{?window_zoomed_flag,#[bg=#84a9b2#,fg=#1d2021#,bold] ZOOM #[bg=#1d2021#,fg=#7c6f64#,nobold],}#{?client_prefix,#[bg=#c9a257#,fg=#1d2021#,bold] COMMAND #[bg=#1d2021#,fg=#7c6f64#,nobold],#{?pane_in_mode,#[bg=#c9a257#,fg=#1d2021#,bold] COPY #[bg=#1d2021#,fg=#7c6f64#,nobold],}}#[bg=#1d2021,fg=#c9a257,bold]● #{=/20/…:pane_title}#[fg=#d0c0a0,nobold]#{?#{e|>=|:#{client_width},80}, · #{=/14/…:pane_current_command},}#[fg=#7c6f64]#{?#{e|>=|:#{client_width},140}, · #{=/22/…;b:pane_current_path},}#{?#{&&:#{e|>=|:#{client_width},120},#{battery_percentage}}, │ #[fg=#84a9b2]#{battery_icon_charge} #{battery_percentage}#[fg=#7c6f64],}#{?SSH_CONNECTION, │ #[fg=#84a9b2#,bold]#h#[fg=#7c6f64#,nobold],} │ #[fg=#ebdbb2,bold]%H:%M '

# Window tabs: inactive tabs stay uniformly dark; only current and bell states differ
set -gw monitor-activity off
set -g visual-activity off
set -g window-status-style "bg=#1d2021,fg=#96918a"
set -g window-status-format ' #I #W '
set -g window-status-current-style "bg=#c9a257,fg=#1d2021,bold"
set -g window-status-current-format ' ● #I #W#{?window_zoomed_flag, 󰁌,} '
set -g window-status-activity-style "bg=#1d2021,fg=#96918a"
set -g window-status-bell-style "bg=#db7e75,fg=#1d2021,bold"
set -g window-status-separator '#[bg=#1d2021,fg=#3c3836]│'

# Pane frames: a rounded four-sided active frame, with pane title and quiet directory context
set -g pane-border-style "fg=#7c6f64"
set -g pane-active-border-style "fg=#c9a257"
set -g pane-border-status top
# Keep heavy joined dividers as a graceful fallback when cfg.package is overridden.
set -g pane-border-lines heavy
if-shell -F '#{!=:#{pane-border-type},}' 'set -g pane-border-lines rounded'
if-shell -F '#{!=:#{pane-border-type},}' 'set -g pane-border-type separate-active'
# Avoid overlay indicators that interrupt the continuous active frame.
if-shell -F '#{>=:#{version},3.7}' 'set -g pane-border-indicators off'
set -g pane-border-format '#[align=centre]#{?pane_active,#[bg=#1d2021#,fg=#c9a257#,bold]  #{=/24/…:pane_title}  #{?#{e|>=|:#{pane_width},52},#[fg=#7c6f64#,nobold]· #{=/20/…;b:pane_current_path}  ,},#[bg=#1d2021#,fg=#7c6f64]  #{=/24/…:pane_title}  }'

# Keep window and terminal titles useful for host/session identification
set -g allow-rename on
set -gw automatic-rename on
set -g set-titles on
set -g set-titles-string '#S · #W · #T'

# Cohesive menus, popups, copy mode, and transient messages
set -g message-style "bg=#c9a257,fg=#1d2021,bold"
set -g message-command-style "bg=#38321f,fg=#ebdbb2"
set -g mode-style "bg=#c9a257,fg=#1d2021,bold"
set -g menu-style "bg=#282828,fg=#d0c0a0"
set -g menu-selected-style "bg=#c9a257,fg=#1d2021,bold"
set -g menu-border-style "bg=#282828,fg=#504945"
set -g menu-border-lines rounded
set -g popup-style "bg=#282828,fg=#d0c0a0"
set -g popup-border-style "bg=#282828,fg=#504945"
set -g popup-border-lines rounded
set -g clock-mode-colour "#c9a257"

# Display pane numbers long enough to orient before switching
set -g display-panes-time 2000
set -g display-panes-colour "#7c6f64"
set -g display-panes-active-colour "#c9a257"

# ===============================================
# RE-RUN BATTERY PLUGIN (must be after status-right is set)
# ===============================================
# The battery plugin interpolates #{battery_*} variables at load time,
# but Home Manager loads plugins BEFORE extraConfig. Re-run to fix.
run-shell 'for f in /nix/store/*tmuxplugin-battery*/share/tmux-plugins/battery/battery.tmux; do [ -x "$f" ] && "$f" && break; done 2>/dev/null || true'
