[package]
name = "tmux-fleet"
version = "0.1.0"
edition = "2021"
description = "Unified local and SSH-backed tmux session picker"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "hostname", "socket", "user"] }
signal-hook = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
