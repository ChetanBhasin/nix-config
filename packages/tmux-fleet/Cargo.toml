[package]
name = "tmux-fleet"
version = "0.1.0"
edition = "2021"
description = "On-demand local tmux and SSH target session picker"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "hostname", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
